services:
  - type: web
    name: teloconsiglio-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/auth/providers
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: JWT__Issuer
        value: TeLoConsiglio
      - key: JWT__Audience
        value: TeLoConsiglio
      - key: JWT__Key
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: BUDGET_MONTHLY_USD
        value: "5.0"
      - key: ENABLE_SWAGGER
        value: "true"
      - key: DOC_ENCRYPTION_KEY
        generateValue: true
        # NOTA: Render genera una stringa random — assicurarsi che sia esattamente 32 byte
        # base64 (256 bit). Se la lunghezza non coincide, impostare manualmente con:
        #   openssl rand -base64 32
        # ATTENZIONE: se la chiave viene persa, i file cifrati diventano irrecuperabili.
      # Da impostare manualmente nella dashboard Render:
      # - ConnectionStrings__Default  (stringa Neon, formato Host=...;Port=5432;Database=...;Username=...;Password=...;SslMode=Require;Trust Server Certificate=true)
      # - Frontend__Url                (URL pubblico Netlify, es https://teloconsiglio.netlify.app)
      # - GEMINI_API_KEY               (opzionale, abilita le funzioni AI - free tier: https://aistudio.google.com/apikey)
      # - GOOGLE_CLIENT_ID/SECRET      (opzionale)
      # - MICROSOFT_CLIENT_ID/SECRET   (opzionale)
      # - SMTP_HOST/SMTP_USER/SMTP_PASS — opzionali, abilitano l'invio email degli inviti
      #   (se mancanti gli inviti sono solo loggati su stdout; SMTP_PORT default 587, SMTP_FROM default no-reply@teloconsiglio.io)
